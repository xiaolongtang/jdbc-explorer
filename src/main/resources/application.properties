spring.main.web-application-type=none
spring.ai.mcp.server.name=jdbc-data-explorer
spring.ai.mcp.server.description=Explore the data in your JDBC database
spring.ai.mcp.server.version=0.4.0

# NOTE: You must disable the banner and the console logging
# to allow the STDIO transport to work !!!
spring.main.banner-mode=off
logging.pattern.console=
logging.level.root=OFF
logging.file.name=jdbc-data-explorer.log
logging.level.com.mike.chao.jdbc.explorer.ExplorerService=INFO

# Bounded connection pools prevent connection storms when an MCP client submits
# several tool calls at once.
db.pool.maximum-size=4
db.pool.minimum-idle=0
db.pool.connection-timeout-ms=10000

# Bound query work and MCP response sizes. All values can be overridden with
# Spring Boot command-line options, for example --db.query.max-rows=500.
db.query.max-rows=1000
db.query.fetch-size=100
db.query.timeout-seconds=30
db.query.max-concurrent-per-database=4
db.query.queue-timeout-seconds=5
db.query.max-cell-characters=10000

db.url=jdbc:sqlite:sample.db
db.username=testuser
db.password=testpassword
